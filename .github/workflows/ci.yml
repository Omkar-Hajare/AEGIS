name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        run: |
          pytest -v

      - name: Build backend Docker image
        run: |
          docker build -t adaptive-cache-backend:latest -f backend/Dockerfile .

      - name: Build frontend Docker image
        run: |
          docker build -t adaptive-cache-frontend:latest -f frontend/Dockerfile .

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Helm lint
        run: |
          helm lint helm/adaptive-cache

      - name: Helm template
        run: |
          helm template adaptive-cache helm/adaptive-cache
