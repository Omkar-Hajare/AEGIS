apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: adaptive-cache
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  APP_NAME: {{ .Values.backend.env.appName | quote }}
  APP_VERSION: {{ .Values.backend.env.appVersion | quote }}
  CACHE_BACKEND: {{ .Values.backend.env.cacheBackend | quote }}
  REDIS_HOST: {{ .Values.backend.env.redisHost | quote }}
  REDIS_PORT: {{ .Values.backend.env.redisPort | quote }}
  REDIS_DB: {{ .Values.backend.env.redisDb | quote }}
  POSTGRES_HOST: {{ .Values.backend.env.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.backend.env.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.backend.env.postgresDb | quote }}
  DATABASE_HOST: {{ .Values.postgres.auth.host | default .Values.backend.env.postgresHost | quote }}
  DATABASE_PORT: {{ .Values.postgres.auth.dbPort | default .Values.backend.env.postgresPort | quote }}
  DATABASE_NAME: {{ .Values.postgres.auth.database | quote }}
  DATABASE_USER: {{ .Values.postgres.auth.user | quote }}
  DATABASE_PASSWORD: {{ .Values.postgres.auth.password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: adaptive-cache
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: adaptive-cache
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
