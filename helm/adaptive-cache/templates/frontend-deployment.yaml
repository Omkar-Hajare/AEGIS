apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: adaptive-cache
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  BACKEND_URL: {{ .Values.frontend.backendUrl | quote }}
  STREAMLIT_SERVER_PORT: {{ .Values.frontend.server.port | quote }}
  STREAMLIT_SERVER_ADDRESS: {{ .Values.frontend.server.address | quote }}
  STREAMLIT_SERVER_HEADLESS: {{ .Values.frontend.server.headless | quote }}
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: {{ .Values.frontend.server.gatherUsageStats | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: adaptive-cache
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: adaptive-cache
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
