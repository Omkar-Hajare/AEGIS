data:
  adaptive-cache.json: "{\n  \"annotations\": {\n    \"list\": []\n  },\n  \"description\": \"Adaptive Cache System \u2014 Real-Time Observability\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"liveNow\": false,\n  \"refresh\": \"5s\",\n  \"schemaVersion\": 39,\n  \"style\": \"dark\",\n  \"tags\": [\n    \"adaptive-cache\",\n    \"hackathon-jury\",\n    \"monitoring\"\n  ],\n  \"templating\": {\n    \"list\": []\n  },\n  \"time\": {\n    \"from\": \"now-5m\",\n    \"to\": \"now\"\n  },\n  \"timepicker\": {},\n  \"timezone\": \"browser\",\n  \"title\": \"Adaptive Cache System\",\n  \"uid\": \"adaptive-cache-dashboard\",\n  \"version\": 1,\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Request Rate\",\n      \"description\": \"Aggregated rate of incoming HTTP requests across all backend pods\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 0, \"y\": 0 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(requests_total[$__rate_interval])) or vector(0)\",\n          \"legendFormat\": \"Request Rate\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"decimals\": 1,\n          \"noValue\": \"0 req/s\",\n          \"color\": { \"mode\": \"palette-classic\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Request Latency P95\",\n      \"description\": \"95th percentile end-to-end request latency across all backend pods\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 4, \"y\": 0 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"((histogram_quantile(0.95, sum(rate(request_latency_seconds_bucket[$__rate_interval])) by (le)) * 1000) >= 0) or vector(0)\",\n          \"legendFormat\": \"P95 Latency\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 1,\n          \"noValue\": \"0 ms\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 200 },\n              { \"color\": \"red\", \"value\": 500 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Backend Latency P95\",\n      \"description\": \"95th percentile latency for origin retrieval on cache misses\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 8, \"y\": 0 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"((histogram_quantile(0.95, sum(rate(backend_latency_seconds_bucket[$__rate_interval])) by (le)) * 1000) >= 0) or vector(0)\",\n          \"legendFormat\": \"Backend P95\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 1,\n          \"noValue\": \"0 ms\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 100 },\n              { \"color\": \"red\", \"value\": 300 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Cache Hit Ratio\",\n      \"description\": \"Cache hit percentage calculated from aggregated counters over the selected Grafana time range. Uses increase() over $__range for consistency with the Streamlit frontend.\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 12, \"y\": 0 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"((sum(increase(cache_hits_total[$__range])) / clamp_min(sum(increase(cache_hits_total[$__range])) + sum(increase(cache_misses_total[$__range])), 1)) * 100) or vector(0)\",\n          \"legendFormat\": \"Hit Ratio\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"decimals\": 1,\n          \"noValue\": \"0%\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 60 },\n              { \"color\": \"green\", \"value\": 80 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Cache Memory\",\n      \"description\": \"Total memory used by cached objects across all backend pods\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 16, \"y\": 0 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(cache_size_bytes) or vector(0)\",\n          \"legendFormat\": \"Cache Memory\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"noValue\": \"0 B\",\n          \"color\": { \"mode\": \"palette-classic\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Running Backend Replicas\",\n      \"description\": \"Available healthy backend pods currently serving traffic\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 20, \"y\": 0 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(kube_deployment_status_replicas_available{deployment=\\\"backend\\\"}) or vector(0)\",\n          \"legendFormat\": \"Replicas\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"noValue\": \"0\",\n          \"color\": { \"mode\": \"palette-classic\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 4 },\n      \"id\": 100,\n      \"title\": \"APPLICATION PERFORMANCE\",\n      \"type\": \"row\"\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Request Latency P95\",\n      \"description\": \"Real-time 95th percentile HTTP request latency over rolling windows\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 10, \"x\": 0, \"y\": 5 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"((histogram_quantile(0.95, sum(rate(request_latency_seconds_bucket[$__rate_interval])) by (le)) * 1000) >= 0)\",\n          \"legendFormat\": \"P95 Request Latency\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 1,\n          \"noValue\": \"0 ms\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineInterpolation\": \"smooth\",\n            \"fillOpacity\": 15,\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"single\", \"sort\": \"none\" },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\"mean\", \"max\"]\n        }\n      }\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Backend Latency P50 and P95\",\n      \"description\": \"Origin service response latency on cache misses (P50 and P95 in ms)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 10, \"x\": 10, \"y\": 5 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"((histogram_quantile(0.50, sum(rate(backend_latency_seconds_bucket[$__rate_interval])) by (le)) * 1000) >= 0)\",\n          \"legendFormat\": \"P50 Backend Latency\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"((histogram_quantile(0.95, sum(rate(backend_latency_seconds_bucket[$__rate_interval])) by (le)) * 1000) >= 0)\",\n          \"legendFormat\": \"P95 Backend Latency\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 1,\n          \"noValue\": \"0 ms\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineInterpolation\": \"smooth\",\n            \"fillOpacity\": 15,\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\"mean\", \"max\"]\n        }\n      }\n    },\n    {\n      \"id\": 9,\n      \"title\": \"HTTP Error Rate\",\n      \"description\": \"Percentage of HTTP requests returning 4xx or 5xx errors\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 8, \"w\": 4, \"x\": 20, \"y\": 5 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"(100 * sum(rate(requests_total{status=~\\\"4..|5..\\\"}[$__rate_interval])) / clamp_min(sum(rate(requests_total[$__rate_interval])), 1)) or vector(0)\",\n          \"legendFormat\": \"Error Rate\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"decimals\": 2,\n          \"noValue\": \"0%\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 1.0 },\n              { \"color\": \"red\", \"value\": 5.0 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 13 },\n      \"id\": 200,\n      \"title\": \"CACHE PERFORMANCE\",\n      \"type\": \"row\"\n    },\n    {\n      \"id\": 11,\n      \"title\": \"Cache Hits vs Cache Misses\",\n      \"description\": \"Aggregated cache hit and miss rates across all pods (only 2 distinct series)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 16, \"x\": 0, \"y\": 14 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(cache_hits_total[$__rate_interval])) or vector(0)\",\n          \"legendFormat\": \"Cache Hits\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"sum(rate(cache_misses_total[$__rate_interval])) or vector(0)\",\n          \"legendFormat\": \"Cache Misses\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\",\n          \"decimals\": 2,\n          \"noValue\": \"0 ops/s\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineInterpolation\": \"smooth\",\n            \"fillOpacity\": 20,\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          }\n        },\n        \"overrides\": [\n          {\n            \"matcher\": { \"id\": \"byName\", \"options\": \"Cache Hits\" },\n            \"properties\": [\n              { \"id\": \"color\", \"value\": { \"fixedColor\": \"#73BF69\", \"mode\": \"fixed\" } }\n            ]\n          },\n          {\n            \"matcher\": { \"id\": \"byName\", \"options\": \"Cache Misses\" },\n            \"properties\": [\n              { \"id\": \"color\", \"value\": { \"fixedColor\": \"#FF9830\", \"mode\": \"fixed\" } }\n            ]\n          }\n        ]\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\"mean\", \"max\"]\n        }\n      }\n    },\n    {\n      \"id\": 12,\n      \"title\": \"Cache Memory\",\n      \"description\": \"Total memory used by cached objects\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 16, \"y\": 14 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(cache_size_bytes) or vector(0)\",\n          \"legendFormat\": \"Cache Memory\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"noValue\": \"0 B\",\n          \"color\": { \"fixedColor\": \"#8AB8FF\", \"mode\": \"fixed\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 23,\n      \"title\": \"Cached Object Count\",\n      \"description\": \"Number of objects currently in the cache\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 20, \"y\": 14 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(cache_object_count) or vector(0)\",\n          \"legendFormat\": \"Objects\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"noValue\": \"0\",\n          \"color\": { \"fixedColor\": \"#B877D9\", \"mode\": \"fixed\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 24,\n      \"title\": \"Total Cache Hits\",\n      \"description\": \"Cumulative cache hits \u2014 each hit is a backend call prevented\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 16, \"y\": 18 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(cache_hits_total) or vector(0)\",\n          \"legendFormat\": \"Total Hits\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"noValue\": \"0\",\n          \"color\": { \"fixedColor\": \"#73BF69\", \"mode\": \"fixed\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 25,\n      \"title\": \"Total Cache Misses\",\n      \"description\": \"Cumulative cache misses \u2014 each miss triggers a backend call\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 20, \"y\": 18 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(cache_misses_total) or vector(0)\",\n          \"legendFormat\": \"Total Misses\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"noValue\": \"0\",\n          \"color\": { \"fixedColor\": \"#FF9830\", \"mode\": \"fixed\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 22 },\n      \"id\": 300,\n      \"title\": \"ADAPTIVE CONTROLLER\",\n      \"type\": \"row\"\n    },\n    {\n      \"id\": 13,\n      \"title\": \"Adaptive Decisions / s\",\n      \"description\": \"Rate of intelligent cache capacity and eviction policy decisions\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 0, \"y\": 23 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(adaptive_decisions_total[$__rate_interval])) or vector(0)\",\n          \"legendFormat\": \"Decisions / s\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\",\n          \"decimals\": 2,\n          \"noValue\": \"0 ops/s\",\n          \"color\": { \"mode\": \"palette-classic\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 14,\n      \"title\": \"Cache Evictions\",\n      \"description\": \"Total objects evicted by the adaptive eviction policy\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 4, \"y\": 23 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(cache_evictions_total) or vector(0)\",\n          \"legendFormat\": \"Evictions\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"noValue\": \"0\",\n          \"color\": { \"mode\": \"palette-classic\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 15,\n      \"title\": \"Backend Calls Prevented\",\n      \"description\": \"Total backend/database queries prevented by serving from cache\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 8, \"y\": 23 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(cache_hits_total) or vector(0)\",\n          \"legendFormat\": \"Backend Calls Prevented\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"noValue\": \"0\",\n          \"color\": { \"fixedColor\": \"#73BF69\", \"mode\": \"fixed\" }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 16,\n      \"title\": \"Origin Latency Pressure\",\n      \"description\": \"Average backend response latency driving the adaptive controller\",\n      \"type\": \"stat\",\n      \"gridPos\": { \"h\": 4, \"w\": 4, \"x\": 12, \"y\": 23 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"avg(backend_avg_latency_ms) or vector(0)\",\n          \"legendFormat\": \"Origin Pressure\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 1,\n          \"noValue\": \"0 ms\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\", \"value\": null },\n              { \"color\": \"yellow\", \"value\": 100 },\n              { \"color\": \"red\", \"value\": 200 }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": { \"values\": false, \"calcs\": [\"lastNotNull\"], \"fields\": \"\" },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 17,\n      \"title\": \"Adaptive Architecture\",\n      \"description\": \"Closed-loop adaptive feedback architecture\",\n      \"type\": \"text\",\n      \"gridPos\": { \"h\": 4, \"w\": 8, \"x\": 16, \"y\": 23 },\n      \"options\": {\n        \"mode\": \"markdown\",\n        \"content\": \"#### Closed-Loop Adaptive Feedback\\n\\n```text\\nRequest \u2192 Redis Lookup \u2192 Cache HIT or MISS\\n\u2192 Backend Retrieval on MISS \u2192 Telemetry Collection\\n\u2192 Workload Analysis \u2192 Adaptive Scoring\\n\u2192 Eviction / Capacity Decision \u2192 Updated Cache State\\n```\\n\\n*Adaptive decision details available in the Streamlit Decisions view.*\\n\"\n      }\n    },\n\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 27 },\n      \"id\": 400,\n      \"title\": \"KUBERNETES SCALING\",\n      \"type\": \"row\"\n    },\n    {\n      \"id\": 18,\n      \"title\": \"Available vs Desired Replicas\",\n      \"description\": \"Available healthy backend pods vs Deployment and HPA target replicas\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 8, \"x\": 0, \"y\": 28 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(kube_deployment_status_replicas_available{deployment=\\\"backend\\\"}) or vector(0)\",\n          \"legendFormat\": \"Available Replicas\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"sum(kube_deployment_spec_replicas{deployment=\\\"backend\\\"}) or vector(0)\",\n          \"legendFormat\": \"Desired Replicas\",\n          \"refId\": \"B\"\n        },\n        {\n          \"expr\": \"sum(kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\\\"backend\\\"}) or vector(0)\",\n          \"legendFormat\": \"HPA Desired\",\n          \"refId\": \"C\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"noValue\": \"0\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineInterpolation\": \"stepAfter\",\n            \"fillOpacity\": 15,\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\"lastNotNull\"]\n        }\n      }\n    },\n    {\n      \"id\": 19,\n      \"title\": \"Backend CPU Usage\",\n      \"description\": \"Aggregated CPU utilization across all backend containers\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 8, \"x\": 8, \"y\": 28 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"(sum(rate(container_cpu_usage_seconds_total{pod=~\\\"backend-.*\\\", container!=\\\"POD\\\", container!=\\\"\\\"}[$__rate_interval])) * 100) or vector(0)\",\n          \"legendFormat\": \"Backend CPU\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"decimals\": 1,\n          \"noValue\": \"0%\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineInterpolation\": \"smooth\",\n            \"fillOpacity\": 20,\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"single\", \"sort\": \"none\" },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\"mean\", \"max\"]\n        }\n      }\n    },\n    {\n      \"id\": 20,\n      \"title\": \"Backend Memory Usage\",\n      \"description\": \"Aggregated working-set memory across all backend containers\",\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 8, \"x\": 16, \"y\": 28 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [\n        {\n          \"expr\": \"sum(container_memory_working_set_bytes{pod=~\\\"backend-.*\\\", container!=\\\"POD\\\", container!=\\\"\\\"}) or vector(0)\",\n          \"legendFormat\": \"Working Set Memory\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"noValue\": \"0 B\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineInterpolation\": \"smooth\",\n            \"fillOpacity\": 20,\n            \"lineWidth\": 2,\n            \"pointSize\": 5,\n            \"showPoints\": \"auto\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"single\", \"sort\": \"none\" },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\"mean\", \"max\"]\n        }\n      }\n    }\n  ]\n}"
